<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Desenvolvedor de Jogos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img class="profile" src="https://avatars.githubusercontent.com/u/11763362?v=4&" alt="Foto do desenvolvedor">
    <h1>Seu Nome Completo</h1>
    <p>Desenvolvedor de jogos apaixonado por criar experiências imersivas.</p>
  </header>

  <div class="container">
    <div class="section">
      <h2>Sobre mim</h2>
      <p>
        Meu objetivo é desenvolver jogos criativos e inovadores, explorando mecânicas únicas e narrativas envolventes.
      </p>
    </div>

    <div class="section">
      <h2>Projetos</h2>
      <div class="projects">
        <div class="project-card">
          <img src="https://assets.nintendo.com/image/upload/q_auto/f_auto/store/software/switch/70010000003208/4643fb058642335c523910f3a7910575f56372f612f7c0c9a497aaae978d3e51" alt="Projeto 1">
          <h3>Jogo Aventura 2D</h3>
        </div>

        <div class="project-card">
          <img src="https://assets.nintendo.com/image/upload/q_auto/f_auto/store/software/switch/70010000003208/4643fb058642335c523910f3a7910575f56372f612f7c0c9a497aaae978d3e51" alt="Projeto 2">
          <h3>Jogo de Plataforma</h3>
        </div>

        <div class="project-card">
          <img src="https://assets.nintendo.com/image/upload/q_auto/f_auto/store/software/switch/70010000003208/4643fb058642335c523910f3a7910575f56372f612f7c0c9a497aaae978d3e51" alt="Projeto 3">
          <h3>Jogo Multiplayer</h3>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
